spring.application.name=telemetry-service

server.port=${SERVER_PORT:8081}


spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/telemetry_db}
spring.datasource.username=${DATABASE_USERNAME:telemetry_user}
spring.datasource.password=${DATABASE_PASSWORD:telemetry_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

services.vehicle-analysis.base-url=${VEHICLE_ANALYSIS_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always