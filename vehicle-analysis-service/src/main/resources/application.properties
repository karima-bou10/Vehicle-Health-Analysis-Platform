spring.application.name=vehicle-analysis-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/analysis_db}
spring.datasource.username=${DATABASE_USERNAME:analysis_user}
spring.datasource.password=${DATABASE_PASSWORD:analysis_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

external-services.recall-provider.base-url=${RECALL_PROVIDER_URL:http://localhost:9090}
external-services.recall-provider.connect-timeout=2s
external-services.recall-provider.read-timeout=3s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always